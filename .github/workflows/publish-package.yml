# Publish Node.js package on GitHub Release.
# - npm: registry.npmjs.org (requires repo secret NPM_TOKEN)
# - GitHub Packages: npm.pkg.github.com (uses GITHUB_TOKEN)
#
# Trigger: create a GitHub Release whose tag matches package.json version
# (e.g. tag v0.1.0 for version 0.1.0), or run workflow_dispatch manually.

name: Publish Node.js Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (must match package.json)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-package-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate publication version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${package_version}."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${DISPATCH_VERSION}" != "${package_version}" ]; then
            echo "Dispatch version ${DISPATCH_VERSION} does not match package version ${package_version}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: npm run check

      - name: Pack dry-run
        run: npm pack --dry-run

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@summersec'

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (GitHub Packages)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@summersec'

      - name: Install dependencies
        run: npm ci

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
